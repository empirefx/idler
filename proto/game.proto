syntax = "proto3";
package game;

message JoinRequest {
  string nickname = 1;
}

message JoinResponse {
  string session_id = 1;
  bool accepted = 2;
  string error = 3;
}

message LeaveNotification {
  string reason = 1;
}

message InventoryAction {
  string action_type = 1;
  string item_id = 2;
  string template_id = 3;
  int32 quantity = 4;
  string from_inventory = 5;
  string to_inventory = 6;
  string slot = 7;
}

message InventorySnapshot {
  string inventory_id = 1;
  repeated Item items = 2;
  int32 max_slots = 3;
  float max_weight = 4;
  float current_weight = 5;
  map<string, Item> equipment = 6;
}

message InventoryDiff {
  string inventory_id = 1;
  string action = 2;
  Item item = 3;
}

message Item {
  string id = 1;
  string template_id = 2;
  string name = 3;
  string type = 4;
  string icon = 5;
  string description = 6;
  int32 quantity = 7;
  float weight = 8;
  map<string, int32> stats = 9;
  map<string, int32> consumable = 10;
  string damage_type = 11;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
  string original_action = 3;
}

message GameMessage {
  string type = 1;
  bytes data = 2;
}
