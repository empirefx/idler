<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idler</title>
  </head>
  <body>
    <div id="login-screen">
      <div class="login-container">
        <h1>Idler</h1>
        <p>Choose your nickname to enter</p>
        <input type="text" id="nickname-input" maxlength="15" placeholder="Nickname (4-15 letters)" autocomplete="off" />
        <button id="join-button">Enter</button>
        <p id="login-error" class="login-error"></p>
      </div>
    </div>
    <div id="root" style="display:none"></div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
